<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coração Cósmico Denso</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #010103;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>

<canvas id="canvas"></canvas>

<script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    let width, height;
    let particles = [];
    let time = 0;
    
    const COLORS = [
        "#ffffff", "#e0f2fe", "#bae6fd", "#7dd3fc", 
        "#38bdf8", "#0ea5e9", "#3b82f6", "#2563eb", "#1d4ed8"
    ];

    function resize() {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    function getHeartPoint(t) {
        const x = 16 * Math.pow(Math.sin(t), 3);
        const y = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
        return { x, y };
    }

    class Particle {
        constructor() {
            this.reset();
        }

        reset() {
            this.startX = width / 2 + (Math.random() - 0.5) * 500; 
            this.startY = height + 100;
            
            this.x = this.startX;
            this.y = this.startY;
            
            const t = Math.random() * Math.PI * 2;
            const heartPoint = getHeartPoint(t);
            const scale = Math.min(width, height) * 0.025; 
            
            this.z = Math.random(); 
            
            // Adiciona um leve espalhamento interno para o coração não ser apenas uma linha vazia
            const innerSpread = (Math.random() - 0.5) * 20 * this.z;

            this.targetX = width / 2 + heartPoint.x * scale * (1 + this.z * 0.2) + innerSpread;
            this.targetY = height / 2 + heartPoint.y * scale * (1 + this.z * 0.2) + innerSpread;

            this.color = COLORS[Math.floor(Math.random() * COLORS.length)];
            
            this.radius = (Math.random() * 1.2 + 0.3) * (1 + this.z * 1.5);
            
            this.vx = 0;
            this.vy = 0;
            this.progress = Math.random() * -2.5; // Atraso maior na subida para preencher aos poucos
            this.speed = Math.random() * 0.012 + 0.004;
            this.angle = Math.random() * Math.PI * 2;
            this.spin = (Math.random() - 0.5) * 0.05;
            this.isFormed = false;
            
            this.history = [];
        }

        update(mouseX, mouseY) {
            if (!this.isFormed) {
                this.progress += this.speed;
                const easeOut = 1 - Math.pow(1 - this.progress, 4); 
                
                const noiseX = Math.sin(this.progress * 12 + time) * 40;
                const noiseY = Math.cos(this.progress * 12 + time) * 40;
                
                this.x = this.startX + (this.targetX - this.startX) * easeOut + noiseX;
                this.y = this.startY + (this.targetY - this.startY) * easeOut + noiseY;

                if (this.progress >= 1) {
                    this.isFormed = true;
                }
            } else {
                this.angle += this.spin;
                
                const beat = Math.pow(Math.sin(time * 4), 8) * 20; 
                
                const currentTargetX = this.targetX + Math.cos(this.angle) * (beat * this.z);
                const currentTargetY = this.targetY + Math.sin(this.angle) * (beat * this.z);

                const driftX = Math.sin(time * 2 + this.angle) * 2;
                const driftY = Math.cos(time * 1.5 + this.angle) * 2;

                this.vx += (currentTargetX + driftX - this.x) * 0.05;
                this.vy += (currentTargetY + driftY - this.y) * 0.05;

                const dx = this.x - mouseX;
                const dy = this.y - mouseY;
                const dist = Math.sqrt(dx * dx + dy * dy);
                
                if (dist < 150 && dist > 0) {
                    const force = (150 - dist) / 150;
                    this.vx += (dx / dist) * force * 8;
                    this.vy += (dy / dist) * force * 8;
                }

                this.vx *= 0.85;
                this.vy *= 0.85;
                this.x += this.vx;
                this.y += this.vy;
            }

            // Otimização: Só guarda histórico se a partícula for grande o suficiente (z alto)
            // para economizar processamento com tantas partículas
            if (this.isFormed && this.z > 0.5) {
                this.history.push({x: this.x, y: this.y});
                if (this.history.length > 4) this.history.shift();
            }
        }

        draw() {
            if (this.history.length > 1) {
                ctx.beginPath();
                ctx.moveTo(this.history[0].x, this.history[0].y);
                for (let i = 1; i < this.history.length; i++) {
                    ctx.lineTo(this.history[i].x, this.history[i].y);
                }
                ctx.strokeStyle = this.color;
                ctx.globalAlpha = 0.15 * this.z;
                ctx.lineWidth = this.radius * 0.5;
                ctx.stroke();
            }

            ctx.beginPath();
            ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
            ctx.fillStyle = this.color;
            
            ctx.globalAlpha = 0.3 + (this.z * 0.7);
            ctx.shadowBlur = this.isFormed ? 12 * this.z : 5;
            ctx.shadowColor = this.color;
            
            ctx.fill();
            
            ctx.globalAlpha = 1;
            ctx.shadowBlur = 0;
        }
    }

    let mouseX = width / 2;
    let mouseY = height / 2;

    window.addEventListener('mousemove', (e) => {
        mouseX = e.clientX;
        mouseY = e.clientY;
    });

    // AUMENTO SIGNIFICATIVO DE PARTÍCULAS
    const PARTICLE_COUNT = 850; 
    
    for (let i = 0; i < PARTICLE_COUNT; i++) {
        particles.push(new Particle());
    }

    // Otimização da teia de conexões
    function drawConnections() {
        ctx.lineWidth = 0.4;
        // Limita a verificação para não travar o navegador com 850 partículas
        for (let i = 0; i < particles.length; i += 2) { 
            const p1 = particles[i];
            if (!p1.isFormed) continue;

            for (let j = i + 2; j < particles.length; j += 2) {
                const p2 = particles[j];
                if (!p2.isFormed) continue;

                const dx = p1.x - p2.x;
                const dy = p1.y - p2.y;
                const dist = Math.sqrt(dx * dx + dy * dy);

                // Reduzi a distância de 40 para 25 para manter a teia fina e performática
                if (dist < 25) {
                    ctx.beginPath();
                    ctx.moveTo(p1.x, p1.y);
                    ctx.lineTo(p2.x, p2.y);
                    
                    const opacity = (1 - dist / 25) * 0.25 * Math.min(p1.z, p2.z);
                    ctx.strokeStyle = `rgba(96, 165, 250, ${opacity})`;
                    ctx.stroke();
                }
            }
        }
    }

    function animate() {
        // Fundo um pouco mais rápido para não acumular tanto rastro e virar uma bola branca
        ctx.fillStyle = 'rgba(1, 1, 3, 0.2)'; 
        ctx.fillRect(0, 0, width, height);

        time += 0.02;

        const auraRadius = 180 + Math.sin(time * 4) * 30; 
        const auraGradient = ctx.createRadialGradient(
            width/2, height/2, 0, 
            width/2, height/2, auraRadius
        );
        auraGradient.addColorStop(0, 'rgba(59, 130, 246, 0.15)');
        auraGradient.addColorStop(0.6, 'rgba(37, 99, 235, 0.05)');
        auraGradient.addColorStop(1, 'rgba(0, 0, 0, 0)');
        
        ctx.fillStyle = auraGradient;
        ctx.fillRect(0, 0, width, height);

        particles.forEach(p => {
            p.update(mouseX, mouseY);
        });

        drawConnections();

        particles.forEach(p => {
            p.draw();
        });

        requestAnimationFrame(animate);
    }

    animate();
    
    window.addEventListener('click', () => {
        particles.forEach(p => p.reset());
    });

</script>

</body>
</html>
